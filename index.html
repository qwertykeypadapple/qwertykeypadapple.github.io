// ---------- a tiny CSS 3D kit ----------
// The world is a 560 x 420 floor seen from above at an angle; x runs right, y runs down the floor, z is up.
const TILT_X = 58, TURN_Z = -40;
const shade = (c, k) => `color-mix(in srgb, ${c} ${100 - k}%, #000)`;
const el = (parent, cls, style) => { const d = document.createElement("div"); if (cls) d.className = cls; if (style) d.style.cssText = style; parent.appendChild(d); return d; };

// a box: x, y on the floor, z off the floor; w along x, d along y, h up. Faces: top, south, west, east, north.
function box(p, x, y, z, w, d, h, col, o = {}) {
  const b = el(p, "", `left:0;top:0;width:${w}px;height:${d}px;transform:translate3d(${x}px,${y}px,${z}px)`);
  const face = (style, bg) => { const f = document.createElement("i"); f.style.cssText = style + `;background:${bg}`; b.appendChild(f); return f; };
  face(`left:0;top:${d - h}px;width:${w}px;height:${h}px;transform-origin:50% 100%;transform:rotateX(-90deg)`, o.south || shade(col, 14));
  face(`left:${-h}px;top:0;width:${h}px;height:${d}px;transform-origin:100% 50%;transform:rotateY(90deg)`, o.west || shade(col, 28));
  face(`left:${w}px;top:0;width:${h}px;height:${d}px;transform-origin:0 50%;transform:rotateY(-90deg)`, shade(col, 34));
  face(`left:0;top:0;width:${w}px;height:${h}px;transform-origin:50% 0;transform:rotateX(90deg)`, shade(col, 22));
  const top = face(`left:0;top:0;width:${w}px;height:${d}px;transform:translateZ(${h}px)`, o.top || col);
  if (o.topHTML) top.innerHTML = o.topHTML;
  if (o.cls) b.className = o.cls;
  return b;
}
// something that always stands up and faces you (a sphere, a sign, a bubble)
function bb(p, x, y, z, w, h, style = "", cls = "", html = "") {
  const wrap = el(p, cls, `left:0;top:0;transform:translate3d(${x}px,${y}px,${z}px)`);
  const b = el(wrap, "bb", `left:${-w / 2}px;top:${-h}px;width:${w}px;height:${h}px;transform:rotateZ(${-TURN_Z}deg) rotateX(${-TILT_X}deg);${style}`);
  if (html) b.innerHTML = html;
  return b;
}
// a line drawn on the floor
function line(p, x1, y1, x2, y2, col, dashed = true, z = 1) {
  const len = Math.hypot(x2 - x1, y2 - y1), a = Math.atan2(y2 - y1, x2 - x1);
  el(p, "", `left:0;top:0;width:${len}px;height:3px;transform-origin:0 50%;transform:translate3d(${x1}px,${y1}px,${z}px) rotateZ(${a}rad);` +
    `background:${dashed ? `repeating-linear-gradient(90deg, ${col} 0 8px, transparent 8px 14px)` : col};border-radius:2px`);
}
const sphere = (c, hi = "#fff") => `border-radius:50%;background:radial-gradient(circle at 34% 30%, ${hi} 0, ${c} 42%, ${shade(c, 45)} 100%);box-shadow:0 8px 18px rgba(0,0,0,.25)`;

// pitch decks: a stack of slides, the first slide on top
function deckModel(m, p) {
  for (let i = 0; i < 4; i++) box(m, i * 4, -i * 3, i * 7, 130, 86, 4, i === 3 ? WHITE : `color-mix(in srgb, ${DOMAINS[p.dom].c} ${30 + i * 15}%, #fff)`,
    i === 3 ? { top: `url(images/${p.img}) center/cover, ${WHITE}` } : {});
  return 70;
}

const byRepo = Object.fromEntries(projects.filter((p) => !p.deck).map((p) => [p.repo, p]));

function linksFor(p) {
  if (p.deck) return `<a href="${p.live}" target="_blank" rel="noopener">Open deck ↗</a>` +
    (p.private ? "" : `<a class="ghost" href="${GH + p.repo}" target="_blank" rel="noopener">GitHub ↗</a>`);
  return (p.private ? "" : `<a href="${GH + p.repo}" target="_blank" rel="noopener">GitHub ↗</a>`) +
    (p.live ? `<a class="${p.private ? "" : "ghost"}" href="${p.live}" target="_blank" rel="noopener">Live site ↗</a>` : "") +
    (p.private ? `<span class="lock">Private repo</span>` : "");
}

function makeWorld(host, { title, no, color, deep, floor, list, place, flip }) {
  const sec = document.createElement("section");
  sec.className = "domain" + (flip ? " flip" : "");
  sec.style.setProperty("--dc", color);
  sec.style.setProperty("--dd", deep);
  sec.setAttribute("aria-label", title);
  sec.innerHTML = `
    <div class="stage" aria-hidden="true"><div class="fit"><div class="world"></div></div></div>
    <div class="info">
      <div class="no">${no}</div>
      <h2>${title}</h2>
      <div class="chips" role="tablist"></div>
      <div class="pick" aria-live="polite"></div>
    </div>`;
  host.appendChild(sec);
  const world = sec.querySelector(".world"), chips = sec.querySelector(".chips"), pick = sec.querySelector(".pick");
  box(world, 0, 0, -26, 560, 420, 26, "var(--edge)", { top: floor || "var(--plate)" });

  const models = list.map((p, k) => {
    const [x, y, tx, ty] = place(p, k);
    const m = el(world, "m", `--mx:${x}px;--my:${y}px`);
    const z = p.deck ? deckModel(m, p) : MODELS[p.repo](m);
    bb(m, tx, ty, z + 18, 0, 0, "width:auto;height:auto", "", "").innerHTML = `<span class="tag">${p.name}</span>`;
    const chip = document.createElement("button");
    chip.type = "button"; chip.setAttribute("role", "tab"); chip.textContent = p.name;
    chips.appendChild(chip);
    const choose = () => select(k);
    m.addEventListener("click", choose);
    chip.addEventListener("click", choose);
    return { m, chip, p };
  });
  function select(k) {
    models.forEach((o, j) => { o.m.classList.toggle("on", j === k); o.chip.classList.toggle("on", j === k); o.chip.setAttribute("aria-selected", String(j === k)); });
    const p = models[k].p;
    pick.innerHTML = `<div class="kind">${p.kind}</div><h3>${p.name}</h3><p class="q">${p.q}</p><div class="links">${linksFor(p)}</div>`;
    pick.classList.remove("swap"); void pick.offsetWidth; pick.classList.add("swap");
  }
  select(0);

  // lean the world a little toward the pointer
  const fit = sec.querySelector(".fit"), stage = sec.querySelector(".stage");
  if (matchMedia("(hover: hover)").matches) {
    stage.addEventListener("pointermove", (e) => {
      const r = stage.getBoundingClientRect();
      fit.style.setProperty("--ty", ((e.clientX - r.left) / r.width - .5) * 10 + "deg");
      fit.style.setProperty("--tx", -((e.clientY - r.top) / r.height - .5) * 8 + "deg");
    });
    stage.addEventListener("pointerleave", () => { fit.style.setProperty("--tx", "0deg"); fit.style.setProperty("--ty", "0deg"); });
  }
  return sec;
}

// size each world to its column, and only animate the ones on screen
function fitAll() {
  document.querySelectorAll(".stage").forEach((s) => s.style.setProperty("--s", Math.min(.8, s.clientWidth / 760).toFixed(3)));
}
fitAll();
let lastW = innerWidth;
addEventListener("resize", () => { if (innerWidth !== lastW) { lastW = innerWidth; fitAll(); } });
const io = new IntersectionObserver((es) => es.forEach((e) => e.target.classList.toggle("live", e.isIntersecting)), { rootMargin: "100px" });
document.querySelectorAll(".domain").forEach((d) => io.observe(d));

// light by default; the choice is remembered on this device
const themeBtn = document.getElementById("theme");
function syncThemeLabel() {
  const dark = document.documentElement.dataset.theme === "dark";
  themeBtn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
}
themeBtn.addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme !== "dark";
  if (dark) document.documentElement.dataset.theme = "dark"; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
  syncThemeLabel();
});
syncThemeLabel();
</script>
</body>
</html>
